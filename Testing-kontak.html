<!DOCTYPE html>
<html lang="id">

<Head>
    <Meta charset="UTF-8">

<body>

        <a href="Home.html">Home</a> |
        <a href="About.html">About</a> |
        <a href="Project.html">Project</a> |
        <a href="Contact.html">Contact</a>

    <hr>
    <h2>Informasi Kontak</h2>
    <p>Jika anda ingin berdiskusi atau bekerja sama, silahkan hubungi saya melalui forms berikut
        Anda juga dapat mengirimi email ke naufal.firza.alkautsar@gmail.com
    </p>
    <h2>Form Pesan</h2>


    <form>
        <table border="3" cellspacing="0" cellpadding="6">
            <tr>
                <th>
                    <label>Nama :</label>
                </th>
                <td>
                    <input type="text" name="nama" />
                </td>
            </tr>
            <tr>
                <th>
                    <label>Email :</label>
                </th>
                <td>
                    <input name="email" />
                </td>
            </tr>
            <tr>
                <th>
                    <label>Password :</label>
                </th>
                <td>
                    <input type="password" name="password" />
                </td>
            </tr>
            <tr>
                <th>
                    <label>Jenis Kelamin :</label>
                </th>
                <td>
                    <input type="radio" name="jk" value="L" />Laki-laki <input type="radio" name="jk"
                        value="P" />Perempuan
                </td>
            </tr>
            <tr>
                <th>
                    <label>Tanggal Lahir :</label>
                </th>
                <td>
                    <input type="date" name="tanggal_lahir" />
                </td>
            </tr>
            <tr>
                <th>
                    <label>Umur :</label>
                </th>
                <td>
                    <input type="number" name="umur" />
                </td>
            </tr>
            <tr>
                <th>
                    <label>Alamat :</label>
                </th>
                <td>
                    <textarea name="alamat" rows="5" cols="33"></textarea>
                </td>
            </tr>
            <tr>
                <th>
                    <label>Pendidikan :</label>
                </th>
                <td>
                    <select name="pendidikan">
                        <option></option>
                        <option value="S3">S3</option>
                        <option value="S2">S2</option>
                        <option value="D4/S1">D4/S1</option>
                        <option value="Diploma">Diploma</option>
                        <option value="SMA/MK">SMA/SMK</option>
                        <option value="SMP">SMP</option>
                        <option value="SD">SD</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>
                    <label>Hobi :</label>
                </th>
                <td>
                    <input type="checkbox" name="hobi" value="Olahraga" />Olahraga <input type="checkbox" name="hobi"
                        value="Membaca" />Membaca <input type="checkbox" name="hobi" value="Ngoding" />Ngoding
                </td>
            </tr>
            <tr>
                <th>
                    <label>Upload Foto :</label>
                </th>
                <td>
                    <input type="file" name="foto" />
                </td>
            </tr>
            <tr>
                <th>
                    <input type="submit" value="Submit" />
                </th>
                <td>
                    <input type="reset" value="Reset" />
                </td>
            </tr>
        </table>
    </form>


</body>

</html>
